[project]
name = "second-brain-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Rezazade", email = "mrprocs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
]

[project.scripts]
second-brain-bot = "second_brain_bot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
